name: Build mtd-utils tools

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-host:
    name: Build x86_64 tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libtool pkg-config

      - name: Configure and build
        run: |
          ./autogen.sh
          ./configure \
            --without-tests \
            --disable-ubihealthd \
            --without-lsmtd \
            --without-jffs \
            --without-ubifs \
            --without-zlib \
            --without-xattr \
            --without-lzo \
            --without-zstd \
            --without-selinux \
            --without-crypto
          make -j"$(nproc)" flash_erase nandwrite

      - name: Package host binaries
        run: |
          mkdir -p artifact-x86_64
          cp flash_erase nandwrite artifact-x86_64/
          sha256sum artifact-x86_64/* | tee artifact-x86_64/SHA256SUMS
          file artifact-x86_64/flash_erase artifact-x86_64/nandwrite

      - name: Upload host binaries
        uses: actions/upload-artifact@v4
        with:
          name: mtd-utils-x86_64
          path: artifact-x86_64

  build-arm:
    name: Build 32-bit ARM soft-float tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ARM cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi libtool pkg-config

      - name: Configure and build
        env:
          CC: arm-linux-gnueabi-gcc
          AR: arm-linux-gnueabi-ar
          RANLIB: arm-linux-gnueabi-ranlib
          CFLAGS: -O2 -marm -mfloat-abi=soft
          LDFLAGS: -static
        run: |
          ./autogen.sh
          ./configure \
            --host=arm-linux-gnueabi \
            --without-tests \
            --disable-ubihealthd \
            --without-lsmtd \
            --without-jffs \
            --without-ubifs \
            --without-zlib \
            --without-xattr \
            --without-lzo \
            --without-zstd \
            --without-selinux \
            --without-crypto
          make -j"$(nproc)" flash_erase nandwrite

      - name: Package ARM binaries
        run: |
          mkdir -p artifact-arm
          cp flash_erase nandwrite artifact-arm/
          sha256sum artifact-arm/* | tee artifact-arm/SHA256SUMS
          file artifact-arm/flash_erase artifact-arm/nandwrite

      - name: Upload ARM binaries
        uses: actions/upload-artifact@v4
        with:
          name: mtd-utils-arm32-soft-float-static
          path: artifact-arm
