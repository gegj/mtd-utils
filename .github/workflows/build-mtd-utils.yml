name: Build mtd-utils tools

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-arm:
    name: Build 32-bit ARM soft-float tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ARM cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi libtool pkg-config

      - name: Configure and build
        env:
          CC: arm-linux-gnueabi-gcc
          AR: arm-linux-gnueabi-ar
          RANLIB: arm-linux-gnueabi-ranlib
          CFLAGS: -Os -marm -mfloat-abi=soft -ffunction-sections -fdata-sections
          LDFLAGS: -Wl,--gc-sections
        run: |
          ./autogen.sh
          ./configure \
            --host=arm-linux-gnueabi \
            --without-tests \
            --disable-ubihealthd \
            --without-lsmtd \
            --without-jffs \
            --without-ubifs \
            --without-zlib \
            --without-xattr \
            --without-lzo \
            --without-zstd \
            --without-selinux \
            --without-crypto
          make -j"$(nproc)" flash_erase nandwrite

      - name: Package ARM binaries
        run: |
          mkdir -p artifact-arm
          cp flash_erase nandwrite artifact-arm/
          arm-linux-gnueabi-strip --strip-unneeded artifact-arm/flash_erase artifact-arm/nandwrite
          sha256sum artifact-arm/* | tee artifact-arm/SHA256SUMS
          file artifact-arm/flash_erase artifact-arm/nandwrite

      - name: Upload ARM binaries
        uses: actions/upload-artifact@v4
        with:
          name: mtd-utils-arm32-soft-float-dynamic-glibc
          path: artifact-arm
