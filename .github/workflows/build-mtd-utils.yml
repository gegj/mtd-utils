name: Build ARM32 mtd-utils (nandwrite + flash_erase)

# 提交到 master / 发起 PR / 手动触发都会编译一个 ARM32 uClibc 动态变体。
# 基线是小端 EABI5 ARMv5TE soft-float / uClibc 0.9.33.2，真机另行验证。
#
# uClibc 变体做了三个必需的兼容处理（详见 .github/compat/README.md）：
#   1) -fno-stack-protector                 去掉 __stack_chk_guard 引用
#   2) -I .github/compat (sysmacros shim)   去掉 gnu_dev_major/minor 引用
#   3) 自建 libc.so 链接脚本只链共享 libc.so.0，避免 NEEDED 里出现 ld-uClibc.so.1
# 编译完成后由 .github/compat/verify-arm-mtd-utils.py 做兼容性门禁，不通过就失败。

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native MTD regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y autoconf automake build-essential libtool pkg-config libcmocka-dev python3
      - name: Configure and test
        run: |
          set -euo pipefail
          python3 .github/compat/verify-arm-mtd-utils.py --self-test
          ./autogen.sh
          ./configure --enable-unit-tests --without-tests --disable-ubihealthd \
            --without-lsmtd --without-jffs --without-ubifs --without-zlib \
            --without-xattr --without-lzo --without-zstd --without-selinux --without-crypto
          make -j"$(nproc)" libmtd.a mtdlib_test
          ./mtdlib_test
          python3 tests/unittests/mtd_tools_test.py

  build:
    needs: native-tests
    name: uclibc / armv5te-softfloat
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_ARCHIVE: armv5-eabi--uclibc--stable-2026.08-1.tar.xz
      TOOLCHAIN_SHA256: 2e78440c4b37a9c84d6165f12fd2525e72bf88c32445e1c3400d1e01384c92ce
      DYNAMIC_LINKER: /lib/ld-uClibc.so.0
      ARTIFACT_DIR: ${{ github.workspace }}/artifact-arm-uclibc

      TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain
      COMPAT_DIR: ${{ github.workspace }}/.github/compat
      COMPAT_LIB_DIR: ${{ github.workspace }}/.compat-lib

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake build-essential file libtool libtool-bin \
            pkg-config python3 xz-utils

      - name: Restore Bootlin toolchain from cache
        id: toolchain_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: bootlin-armv5-eabi-${{ env.TOOLCHAIN_ARCHIVE }}

      - name: Download Bootlin toolchain
        if: steps.toolchain_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/${{ env.TOOLCHAIN_ARCHIVE }}"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$RUNNER_TEMP/toolchain.tar.xz"
          printf '%s  %s\n' "${{ env.TOOLCHAIN_SHA256 }}" "$RUNNER_TEMP/toolchain.tar.xz" | sha256sum --check -
          rm -rf "$TOOLCHAIN_DIR"
          mkdir -p "$TOOLCHAIN_DIR"
          tar -xJf "$RUNNER_TEMP/toolchain.tar.xz" -C "$TOOLCHAIN_DIR" --strip-components=1
          rm -f "$RUNNER_TEMP/toolchain.tar.xz"

      - name: Detect cross toolchain prefix
        id: tc
        run: |
          set -euo pipefail
          prefix="$(basename "$(ls "$TOOLCHAIN_DIR"/bin/*-gcc | head -1)" -gcc)"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          "$TOOLCHAIN_DIR/bin/$prefix-gcc" -dumpmachine
          echo "release=$(grep -oP 'm4_define\(\[RELEASE\], \K[0-9.]+' configure.ac)" >> "$GITHUB_OUTPUT"

      - name: Prepare uClibc compatibility layer
        run: |
          set -euo pipefail
          # 让 -lc 解析到我们自己的脚本：只链共享 libc.so.0。
          # uClibc-ng 的 libc.so 链接脚本带 AS_NEEDED(ld-uClibc.so.1)，
          # 会让产物的 NEEDED 里多出 ld-uClibc.so.1，而设备上只有 ld-uClibc.so.0。
          sysroot="$("$TOOLCHAIN_DIR/bin/${{ steps.tc.outputs.prefix }}-gcc" -print-sysroot)"
          rm -rf "$COMPAT_LIB_DIR"
          mkdir -p "$COMPAT_LIB_DIR"
          printf 'INPUT ( %s/lib/libc.so.0 )\n' "$sysroot" > "$COMPAT_LIB_DIR/libc.so"
          echo "自建链接脚本：$(cat "$COMPAT_LIB_DIR/libc.so")"
          ls -l "$sysroot/lib/libc.so.0"
          echo "sysmacros shim：$COMPAT_DIR/sys/sysmacros.h"
          head -5 "$COMPAT_DIR/sys/sysmacros.h"

      - name: Export cross build flags
        run: |
          set -euo pipefail
          cflags="-Os -marm -march=armv5te -mfloat-abi=soft -ffunction-sections -fdata-sections"
          cppflags=""
          ldflags="-Wl,--gc-sections"
          cflags="$cflags -fno-stack-protector"
          cppflags="-I$COMPAT_DIR"
          ldflags="$ldflags -Wl,--dynamic-linker=$DYNAMIC_LINKER -L$COMPAT_LIB_DIR"
          {
            echo "CC=${{ steps.tc.outputs.prefix }}-gcc"
            echo "AR=${{ steps.tc.outputs.prefix }}-ar"
            echo "RANLIB=${{ steps.tc.outputs.prefix }}-ranlib"
            echo "CFLAGS=$cflags"
            echo "CPPFLAGS=$cppflags"
            echo "LDFLAGS=$ldflags"
          } >> "$GITHUB_ENV"
          echo "CFLAGS  = $cflags"
          echo "CPPFLAGS= $cppflags"
          echo "LDFLAGS = $ldflags"

      - name: Configure and build nandwrite + flash_erase
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-uclibc.log"
          ./autogen.sh 2>&1 | tee "$log"
          ./configure \
            --host="${{ steps.tc.outputs.prefix }}" \
            --build="$(gcc -dumpmachine)" \
            --without-tests \
            --disable-ubihealthd \
            --without-lsmtd \
            --without-jffs \
            --without-ubifs \
            --without-zlib \
            --without-xattr \
            --without-lzo \
            --without-zstd \
            --without-selinux \
            --without-crypto 2>&1 | tee -a "$log"
          # 顶层 Makefile.am 是非递归构建（include */Makemodule.am），产物就在仓库根目录
          make -j"$(nproc)" flash_erase nandwrite 2>&1 | tee -a "$log"

      - name: Collect and strip binaries
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          for name in flash_erase nandwrite; do
            file="$name"
            if [ ! -f "$file" ]; then
              file="$(find . -maxdepth 3 -type f -name "$name" -print -quit)"
            fi
            test -n "$file" && test -f "$file"
            cp "$file" "$ARTIFACT_DIR/$name"
          done
          "${{ steps.tc.outputs.prefix }}-strip" --strip-unneeded --keep-section=.ARM.attributes \
            "$ARTIFACT_DIR/flash_erase" "$ARTIFACT_DIR/nandwrite"
          for name in flash_erase nandwrite; do
            echo "ARM attributes before and after strip: $name"
            "${{ steps.tc.outputs.prefix }}-readelf" -A "$name"
            "${{ steps.tc.outputs.prefix }}-readelf" -A "$ARTIFACT_DIR/$name"
          done
          ls -l "$ARTIFACT_DIR"

      - name: Compatibility gate
        run: |
          set -euo pipefail
          args=(--binaries "$ARTIFACT_DIR/flash_erase" "$ARTIFACT_DIR/nandwrite"
                --interp-re '^/lib/ld-uClibc\.so\.0$'
                --needed-re '^libc\.so\.0$'
                --max-size 204800)
          args+=(--symbol-gate "$COMPAT_DIR/uclibc-0.9.33.2-dynsyms.txt"
                 --forbid-symbols gnu_dev_major gnu_dev_minor __stack_chk_guard)
          python3 "$COMPAT_DIR/verify-arm-mtd-utils.py" "${args[@]}" | tee "$ARTIFACT_DIR/STATIC-VERIFICATION.txt"

      - name: Write BUILD-INFO / SHA256SUMS / 选型说明
        run: |
          set -euo pipefail
          cat > "$ARTIFACT_DIR/BUILD-INFO.txt" <<EOF
          mtd-utils=${{ steps.tc.outputs.release }}
          source=${{ github.repository }}@${{ github.sha }}
          toolchain=Bootlin ${{ env.TOOLCHAIN_ARCHIVE }}
          target=${{ steps.tc.outputs.prefix }}
          libc=uclibc-0.9.33-compatible
          arch=armv5te-softfloat
          dynamic_linker=$DYNAMIC_LINKER
          uclibc_compat=true
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          ( cd "$ARTIFACT_DIR" && sha256sum flash_erase nandwrite | tee SHA256SUMS )
          cat > "$ARTIFACT_DIR/HOW-TO-PICK.txt" <<'EOF'
          设备上怎么挑这一份（先看设备 /lib 里有哪些 loader）：

            /lib/ld-uClibc.so.0       -> 候选 uClibc 变体，仍需核对 libc 符号和设备 ABI

          其它提示：
            - 此变体是小端 ARMv5TE EABI5 soft-float；ARMv6/ARMv7 仍需匹配 libc 和内核接口；
            - 推送后先跑 `/tmp/nandwrite -V`，输出正确仅证明版本路径可以加载运行
              （uClibc 的 loader 在加载失败时可能仍然返回退出码 0，不能只看退出码）；
            - flash_erase 支持 NAND/NOR；nandwrite 仅写 NAND，拒绝 NOR。
            - 文件模型和 ioctl 单元测试不等于物理闪存验证。
            - 本构建没有执行真机 NOR 擦除、NAND 写入或 raw/OOB 验收。
          EOF
          cat "$ARTIFACT_DIR/BUILD-INFO.txt"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mtd-utils-uclibc-build-log
          path: ${{ runner.temp }}/build-uclibc.log
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: mtd-utils-${{ steps.tc.outputs.release }}-arm32-uclibc-armv5te-softfloat
          path: ${{ env.ARTIFACT_DIR }}
