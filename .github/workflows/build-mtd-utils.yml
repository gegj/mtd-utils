name: Build ARM32 uClibc mtd-utils

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ARMv5 EABI uClibc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOOLCHAIN_VERSION: stable-2026.08-1
      TOOLCHAIN_ARCHIVE: armv5-eabi--uclibc--stable-2026.08-1.tar.xz
      TOOLCHAIN_SHA256: 2e78440c4b37a9c84d6165f12fd2525e72bf88c32445e1c3400d1e01384c92ce
      TOOLCHAIN_PREFIX: arm-buildroot-linux-uclibcgnueabi
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake build-essential file libtool libtool-bin \
            pkg-config xz-utils

      - name: Download and verify ARM uClibc toolchain
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$TOOLCHAIN_ARCHIVE"
          toolchain_dir="$RUNNER_TEMP/arm-uclibc-toolchain"
          url="https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/$TOOLCHAIN_ARCHIVE"

          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          printf '%s  %s\n' "$TOOLCHAIN_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$toolchain_dir"
          tar -xJf "$archive" -C "$toolchain_dir" --strip-components=1

          test -x "$toolchain_dir/bin/$TOOLCHAIN_PREFIX-gcc"
          test -x "$toolchain_dir/bin/$TOOLCHAIN_PREFIX-strip"
          test -e "$toolchain_dir/$TOOLCHAIN_PREFIX/sysroot/lib/ld-uClibc.so.0"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

      - name: Configure and build flash_erase and nandwrite
        env:
          CC: arm-buildroot-linux-uclibcgnueabi-gcc
          AR: arm-buildroot-linux-uclibcgnueabi-ar
          RANLIB: arm-buildroot-linux-uclibcgnueabi-ranlib
          CFLAGS: -Os -marm -march=armv5te -mfloat-abi=soft -ffunction-sections -fdata-sections
          LDFLAGS: -Wl,--gc-sections -Wl,--dynamic-linker=/lib/ld-uClibc.so.0
        run: |
          set -euo pipefail
          ./autogen.sh 2>&1 | tee "$RUNNER_TEMP/mtd-utils-build.log"
          ./configure \
            --host="$TOOLCHAIN_PREFIX" \
            --build="$(gcc -dumpmachine)" \
            --without-tests \
            --disable-ubihealthd \
            --without-lsmtd \
            --without-jffs \
            --without-ubifs \
            --without-zlib \
            --without-xattr \
            --without-lzo \
            --without-zstd \
            --without-selinux \
            --without-crypto 2>&1 | tee -a "$RUNNER_TEMP/mtd-utils-build.log"
          make -j"$(nproc)" flash_erase nandwrite 2>&1 \
            | tee -a "$RUNNER_TEMP/mtd-utils-build.log"

      - name: Strip and verify ARM binaries
        run: |
          set -euo pipefail
          mkdir -p artifact-arm-uclibc
          cp flash_erase nandwrite artifact-arm-uclibc/
          "${TOOLCHAIN_PREFIX}-strip" --strip-unneeded \
            artifact-arm-uclibc/flash_erase \
            artifact-arm-uclibc/nandwrite

          for binary in artifact-arm-uclibc/flash_erase artifact-arm-uclibc/nandwrite; do
            "${TOOLCHAIN_PREFIX}-readelf" -h "$binary" | grep -Eq 'Class:[[:space:]]+ELF32'
            "${TOOLCHAIN_PREFIX}-readelf" -h "$binary" | grep -Eq 'Machine:[[:space:]]+ARM'
            "${TOOLCHAIN_PREFIX}-readelf" -l "$binary" \
              | grep -Fq 'Requesting program interpreter: /lib/ld-uClibc.so.0'
          done

          file artifact-arm-uclibc/flash_erase artifact-arm-uclibc/nandwrite
          printf 'toolchain=Bootlin %s\ntarget=%s\nlibc=uClibc\narch=ARMv5 EABI soft-float\ninterpreter=/lib/ld-uClibc.so.0\n' \
            "$TOOLCHAIN_VERSION" "$TOOLCHAIN_PREFIX" > artifact-arm-uclibc/BUILD-INFO.txt
          sha256sum artifact-arm-uclibc/flash_erase artifact-arm-uclibc/nandwrite \
            | tee artifact-arm-uclibc/SHA256SUMS

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm-uclibc-build-log
          path: ${{ runner.temp }}/mtd-utils-build.log
          if-no-files-found: ignore

      - name: Upload ARM uClibc binaries
        uses: actions/upload-artifact@v7
        with:
          name: mtd-utils-arm32-uclibc-armv5te
          path: artifact-arm-uclibc
